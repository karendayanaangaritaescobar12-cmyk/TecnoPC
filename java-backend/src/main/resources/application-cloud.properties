# Remote MySQL-compatible database. Credentials remain outside the source tree.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:4000}/${DB_NAME:tecnopc}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=5000&socketTimeout=10000&tcpKeepAlive=true
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=180000
