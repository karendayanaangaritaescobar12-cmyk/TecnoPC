# Enable alongside cloud,hosted ONLY after verifying the complete proxy chain.
# Required values are Java regular expressions, not CIDR ranges.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.protocol-header-https-value=https
server.tomcat.remoteip.internal-proxies=${RENDER_INTERNAL_PROXIES_REGEX}
server.tomcat.remoteip.trusted-proxies=${RENDER_TRUSTED_PROXIES_REGEX}
server.tomcat.redirect-context-root=false
