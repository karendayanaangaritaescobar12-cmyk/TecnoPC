server.port=8081
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tecnopc?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.minimum-idle=0
spring.jdbc.template.query-timeout=5s
spring.transaction.default-timeout=10s
server.tomcat.threads.max=48
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=200
server.tomcat.accept-count=32
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=5s
server.tomcat.max-keep-alive-requests=50
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.forward-headers-strategy=none
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
spring.jackson.deserialization.accept-float-as-int=false
spring.flyway.enabled=true
spring.flyway.connect-retries=3
spring.flyway.connect-retries-interval=2s
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
tecnopc.notifications.email.enabled=${EMAIL_ENABLED:false}
tecnopc.notifications.email.api-key=${RESEND_API_KEY:}
tecnopc.notifications.email.from=${EMAIL_FROM:}
tecnopc.notifications.whatsapp.enabled=${WHATSAPP_ENABLED:false}
tecnopc.notifications.whatsapp.token=${WHATSAPP_TOKEN:}
tecnopc.notifications.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
tecnopc.notifications.whatsapp.api-version=${WHATSAPP_API_VERSION:v27.0}
tecnopc.notifications.whatsapp.template=${WHATSAPP_TEMPLATE:tecnopc_actualizacion}
tecnopc.notifications.whatsapp.language=${WHATSAPP_LANGUAGE:es}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
