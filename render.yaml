services:
  - type: web
    name: tecnopc
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /livez
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud,hosted
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '4000'
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_ENABLED
        value: 'false'
      - key: WHATSAPP_ENABLED
        value: 'false'
